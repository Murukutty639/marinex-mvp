services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 4000
      APP_ORIGIN: http://localhost:8080
      DATABASE_PATH: /app/storage/marinex.sqlite
      UPLOAD_DIR: /app/storage/uploads
      SESSION_SECRET: docker-demo-secret-change-me
    volumes:
      - marinex-storage:/app/storage
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  marinex-storage:
